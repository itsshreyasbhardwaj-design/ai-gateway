packages:
  - 'apps/*'
  - 'packages/*'
  - 'tests'
  - 'benchmarks'
  - 'examples'

# esbuild ships a platform-specific binary via its install script; vitest and
# tsx both need it. Everything else stays script-free.
allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  sharp: true
  unrs-resolver: true

# Transitive advisories reachable only through build tooling. Pinned to the
# patched versions rather than waiting for upstream to bump them.
overrides:
  postcss: '^8.5.18'
  esbuild: '^0.25.0'
  vite: '^6.4.3'
